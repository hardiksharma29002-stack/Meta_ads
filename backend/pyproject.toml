[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adatlas-backend"
version = "1.0.0"
description = "AdAtlas India - Meta Ad Library City Intelligence & Outreach Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.3",
    "redis>=5.1.0",
    "celery>=5.4.0",
    "httpx>=0.27.2",
    "selectolax>=0.3.21",
    "extruct>=0.16.0",
    "phonenumbers>=8.13.47",
    "email-validator>=2.2.0",
    "dnspython>=2.6.1",
    "tldextract>=5.1.2",
    "rapidfuzz>=3.10.0",
    "lingua-language-detector>=2.0.2",
    "structlog>=24.4.0",
    "pyjwt>=2.9.0",
    "cryptography>=43.0.1",
    "pyyaml>=6.0.2",
    "boto3>=1.35.30",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.112.1",
    "respx>=0.21.1",
    "ruff>=0.6.9",
    "mypy>=1.11.2",
    "types-pyyaml>=6.0.12",
]

[tool.pytest.ini_options]
pythonpath = [".", "backend"]
asyncio_mode = "auto"
testpaths = ["tests"]
